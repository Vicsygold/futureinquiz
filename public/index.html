<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FutureIN Quiz · Young Innovators</title>
<link rel="icon" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Lexend:wght@600;700;800&family=Poppins:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/brand.css">
<script src="/api.js"></script>
<link rel="stylesheet" href="/gamify.css">
<script src="/gamify.js"></script>
<style id="page-css">
  /* Floating bubbles & background sparkles */
  .bubbles { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .bubbles span { position: absolute; border-radius: 50%; opacity: .22; animation: floatBubble 10s ease-in-out infinite; filter: blur(1px); }
  @keyframes floatBubble {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-38px) scale(1.08); }
  }

  .child-wrap { position: relative; z-index: 1; max-width: 680px; width: 100%; margin: 0 auto; display: grid; gap: 20px; }

  /* Mascot banner on top of the card */
  .mascot-hero { display: flex; align-items: center; gap: 18px; margin-bottom: 24px; }
  .mascot-avatar { width: clamp(86px, 18vw, 110px); flex: none; animation: wobble 2.6s ease-in-out infinite; cursor: pointer; filter: drop-shadow(0 10px 18px rgba(0,0,0,.35)); }
  .mascot-avatar:hover { transform: scale(1.08) rotate(4deg); }
  @keyframes wobble { 25% { transform: rotate(-5deg); } 75% { transform: rotate(5deg); } }

  .bubble-msg {
    position: relative; background: #fff; color: #1e1338;
    padding: 16px 20px; border-radius: 22px;
    box-shadow: 0 10px 28px rgba(0,0,0,.28);
    border: 3.5px solid var(--yellow); animation: popIn .45s ease-out;
    flex: 1; min-width: 0;
  }
  .bubble-msg::before {
    content: ""; position: absolute; left: -11px; top: 50%; transform: translateY(-50%);
    border-width: 9px 12px 9px 0; border-style: solid; border-color: transparent #fff transparent transparent;
  }
  @keyframes popIn { from { transform: scale(.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  .kid-hero-title { font-family: 'Fredoka', var(--display); font-size: clamp(20px, 4.4vw, 27px); margin: 0 0 6px; line-height: 1.2; color: #1e1338; font-weight: 700; }
  .kid-hero-title .in-violet { color: #8338ec; }
  .kid-hero-sub { color: #4b3e68; font-family: 'Fredoka', 'Poppins', sans-serif; font-size: clamp(13px, 2.6vw, 15px); font-weight: 500; margin: 0; line-height: 1.4; }

  @media (max-width: 520px) {
    .mascot-hero { flex-direction: column; align-items: center; text-align: center; gap: 14px; }
    .bubble-msg::before {
      left: 50%; top: -11px; transform: translateX(-50%);
      border-width: 0 9px 12px 9px;
      border-color: transparent transparent #fff transparent;
    }
  }

  /* Main Kid-Friendly Form Card */
  .card.kid-card {
    background: linear-gradient(180deg, rgba(31, 14, 74, 0.95), rgba(22, 8, 56, 0.98));
    border: 2px solid rgba(155, 77, 255, 0.45);
    border-radius: 28px; padding: clamp(20px, 4vw, 32px);
    box-shadow: 0 24px 60px rgba(5, 0, 25, 0.7), 0 0 35px rgba(155, 77, 255, 0.2);
    position: relative; overflow: hidden;
  }
  .card.kid-card::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 5px;
    background: linear-gradient(90deg, #ff6b9a, #ffc629, #36c46b, #3aa8f0, #9b4dff);
  }

  /* Form Fields */
  .field label { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; color: #fff; margin-bottom: 6px; }
  .field .f-icon { font-size: 19px; }
  .field input, .field select {
    font-family: inherit; font-size: 16px; font-weight: 500;
    padding: 13px 18px; border-radius: 18px;
    border: 2px solid var(--line-2); background: #0c0024; color: #fff;
    transition: border-color .2s, box-shadow .2s; outline: none;
  }
  .field input:focus, .field select:focus {
    border-color: var(--yellow); box-shadow: 0 0 0 4px rgba(255, 198, 41, 0.25);
  }
  .field input::placeholder { color: var(--faint); font-weight: 400; }

  /* 3D Kid-Friendly Start Button */
  .btn-start-quiz {
    font-family: 'Fredoka', var(--display); font-size: 20px; font-weight: 700; letter-spacing: .02em;
    padding: 15px 28px; border-radius: 999px; border: none; cursor: pointer;
    background: linear-gradient(135deg, #ffc629, #ffa800); color: #0e002c;
    box-shadow: 0 6px 0 #cc8600, 0 12px 24px rgba(255, 198, 41, 0.35);
    width: 100%; transition: transform .12s, box-shadow .12s, filter .12s;
    margin-top: 6px; display: flex; align-items: center; justify-content: center; gap: 10px;
  }
  .btn-start-quiz:hover { filter: brightness(1.06); transform: translateY(-2px); box-shadow: 0 8px 0 #cc8600, 0 16px 28px rgba(255, 198, 41, 0.45); }
  .btn-start-quiz:active { transform: translateY(4px); box-shadow: 0 2px 0 #cc8600; }
  .btn-start-quiz:disabled { opacity: .4; cursor: not-allowed; transform: none; box-shadow: none; }



  /* Top Bar Actions & Sound Button */
  .sound-toggle-btn {
    font-family: inherit; font-size: 14px; font-weight: 600; padding: 7px 14px;
    border-radius: 999px; border: 1.5px solid #c9c5dc; background: #fff;
    color: var(--bar-ink); cursor: pointer; display: flex; align-items: center; gap: 6px;
    transition: transform .15s, background .15s;
  }
  .sound-toggle-btn:hover { background: #f0edf8; transform: scale(1.04); }

  /* Generic Quiz Runner fallback */
  .c-top { display: flex; justify-content: space-between; color: var(--muted); font-weight: 600; margin-bottom: 10px; font-variant-numeric: tabular-nums; font-size: 15px; }
  .c-top .timer { color: var(--yellow); }
  .c-bar { height: 8px; background: var(--night); border-radius: 99px; overflow: hidden; margin-bottom: 24px; }
  .c-bar > div { height: 100%; background: linear-gradient(90deg, var(--violet-deep), var(--violet)); width: 0; transition: width .3s; }
  .c-opts { display: grid; gap: 10px; margin-bottom: 22px; }
  .c-opt { display: flex; gap: 12px; align-items: center; text-align: left; font: inherit; font-size: 16px; padding: 13px 14px; border-radius: 16px; border: 1.5px solid var(--line); background: var(--night); color: var(--ink); cursor: pointer; }
  .c-opt:hover { border-color: var(--violet); }
  .c-opt .l { flex: none; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; background: var(--surface-2); color: var(--violet); font-family: var(--display); }
  .c-opt.sel { border-color: var(--yellow); background: rgba(255, 198, 41, .1); }
  .c-opt.sel .l { background: var(--yellow); color: var(--night); }
  .c-nav { display: flex; gap: 10px; }
  .c-nav .primary { flex: 1; }
  .c-center { text-align: center; }
  .c-big { font-family: var(--display); font-weight: 800; letter-spacing: -.04em; font-size: 76px; line-height: 1; color: var(--yellow); margin: 16px 0 8px; font-variant-numeric: tabular-nums; }
  .c-notice-icon { width: 64px; height: 64px; border-radius: 50%; margin: 0 auto 14px; display: grid; place-items: center; background: rgba(255, 198, 41, .12); color: var(--yellow); font-size: 30px; }
</style>
</head>
<body>
<!-- Animated Floating Bubbles -->
<div class="bubbles" aria-hidden="true" id="bubbleCanvas"></div>

<!-- Topbar -->
<header class="topbar"><div class="in">
  <span class="logo"><img src="/logo.png" alt="FutureIN"><span class="sep"></span><span class="label">Quiz</span></span>
  <div style="display:flex; align-items:center; gap:8px;">
    <button class="sound-toggle-btn" id="soundToggle" type="button" title="Toggle sound effects">🔊 Sound On</button>
  </div>
</div></header>

<main class="wrap" id="childApp">
  <section class="child-wrap">

    <!-- Start / Hero Card -->
    <div class="card kid-card" id="c_start">

      <!-- Welcoming Mascot & Speech Bubble -->
      <div class="mascot-hero">
        <div class="mascot-avatar" id="mascotAvatar" title="FutureIN Robot Friend">
          <svg viewBox="0 0 200 200" width="100%" height="100%">
            <!-- Antenna -->
            <line x1="100" y1="28" x2="100" y2="4" stroke="#ffc629" stroke-width="6" stroke-linecap="round"/>
            <polygon points="100,2 104,11 114,12 106,19 108,29 100,23 92,29 94,19 86,12 96,11" fill="#ffc629"/>
            <!-- Body -->
            <rect x="22" y="28" width="156" height="114" rx="26" fill="#9b4dff" stroke="#7a34d6" stroke-width="5"/>
            <!-- Face Screen -->
            <rect x="36" y="40" width="128" height="90" rx="18" fill="#140833"/>
            <!-- Cute Eyes -->
            <circle cx="72" cy="74" r="14" fill="#3ddc84"/>
            <circle cx="128" cy="74" r="14" fill="#3ddc84"/>
            <circle cx="76" cy="70" r="5" fill="#fff"/>
            <circle cx="132" cy="70" r="5" fill="#fff"/>
            <!-- Rosy Cheeks -->
            <circle cx="56" cy="94" r="9" fill="#ff6b9a" opacity=".7"/>
            <circle cx="144" cy="94" r="9" fill="#ff6b9a" opacity=".7"/>
            <!-- Big Smile -->
            <path d="M80 94 Q100 114 120 94" stroke="#ffc629" stroke-width="6" fill="none" stroke-linecap="round"/>
            <!-- Neck & Base Stand -->
            <rect x="88" y="142" width="24" height="18" fill="#7a34d6"/>
            <rect x="52" y="158" width="96" height="16" rx="8" fill="#ffc629" stroke="#cc8600" stroke-width="3"/>
          </svg>
        </div>
        <div class="bubble-msg">
          <h1 class="kid-hero-title">Are you a future <span class="in-violet">innovator?</span> 🚀</h1>
          <p class="kid-hero-sub" id="mascotBubble">Hello Young Innovator! 🌟 Enter your details below and choose your class to begin your quiz!</p>
        </div>
      </div>

      <form id="c_form" autocomplete="off" novalidate>
        <div class="field">
          <label for="c_name"><span class="f-icon">👤</span> Your full name</label>
          <input id="c_name" maxlength="80" placeholder="e.g. Victor Adebayo">
        </div>
        <div class="field">
          <label for="c_school"><span class="f-icon">🏫</span> Your school</label>
          <input id="c_school" maxlength="80" placeholder="e.g. Precious Stone School">
        </div>
        <div class="field">
          <label for="c_class"><span class="f-icon">🎓</span> Choose your class</label>
          <select id="c_class"><option value="">Select your class...</option></select>
        </div>
        <div class="err" id="c_err" role="alert"></div>
        <button class="btn-start-quiz" type="submit" id="c_go">
          <span>🚀</span> Start Quiz <span>▶</span>
        </button>
      </form>
    </div>

    <!-- No Quiz Notice -->
    <div class="card c-center" id="c_none" hidden>
      <div class="c-notice-icon">✦</div>
      <h2>No quiz for <span id="c_noneClass"></span> yet</h2>
      <p class="sub">There is no quiz for your class right now. Please check back later or ask your teacher.</p>
      <button class="ghost" type="button" id="c_noneBack">Go back</button>
    </div>

    <!-- Generic Quiz Runner Fallback (For unpublished classes) -->
    <div class="card" id="c_quiz" hidden>
      <div class="c-top"><span id="c_counter"></span><span class="timer" id="c_timer">⏱ 0:00</span></div>
      <div class="c-bar"><div id="c_progress"></div></div>
      <h2 id="c_q"></h2>
      <div class="c-opts" id="c_opts"></div>
      <div class="err" id="c_qerr" role="alert"></div>
      <div class="c-nav">
        <button class="ghost" id="c_back" type="button">Back</button>
        <button class="primary" id="c_next" type="button" disabled>Next</button>
      </div>
    </div>

    <!-- Completed Screen (Fallback Runner) -->
    <div class="card framed c-center" id="c_done" hidden>
      <h1>Well done, <span id="c_doneName" class="in-violet"></span>!</h1>
      <p class="c-big" id="c_doneScore"></p>
      <p class="sub" id="c_doneTime"></p>
      <div id="c_doneBadges"></div>
      <button class="primary" id="c_again" type="button">Back to start</button>
    </div>
  </section>
  <p class="foot">© Future Innovators Network (Future<span class="in-violet">IN</span>)</p>
</main>

<script id="page-js">
(function () {
  const $ = (id) => document.getElementById(id);
  let st = null, tick = null, classes = [];
  let soundOn = true, actx = null;

  /* Sound Synthesis */
  function playTone(freq, start, dur, type = 'sine', vol = 0.16) {
    if (!soundOn) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(vol, actx.currentTime + start);
      g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + start + dur);
      o.connect(g).connect(actx.destination);
      o.start(actx.currentTime + start);
      o.stop(actx.currentTime + start + dur);
    } catch (e) {}
  }
  const chime = () => [523, 659, 784, 1047].forEach((f, i) => playTone(f, i * 0.08, 0.25, 'triangle'));
  const popTone = () => playTone(600, 0, 0.1, 'sine');

  $('soundToggle').onclick = () => {
    soundOn = !soundOn;
    $('soundToggle').textContent = soundOn ? '🔊 Sound On' : '🔇 Sound Off';
    if (soundOn) chime();
  };

  /* Floating Bubbles Canvas */
  (function createBubbles() {
    const colors = ['#ff6b9a', '#3aa8f0', '#ffc629', '#36c46b', '#9b4dff', '#4cb8ff'];
    const box = $('bubbleCanvas');
    if (!box) return;
    for (let i = 0; i < 14; i++) {
      const s = document.createElement('span');
      const size = 30 + Math.random() * 85;
      Object.assign(s.style, {
        width: size + 'px', height: size + 'px',
        left: (Math.random() * 96) + 'vw', top: (Math.random() * 95) + 'vh',
        background: colors[i % colors.length],
        animationDelay: (Math.random() * 6) + 's',
        animationDuration: (7 + Math.random() * 6) + 's'
      });
      box.appendChild(s);
    }
  })();

  function show(id) { ['c_start', 'c_none', 'c_quiz', 'c_done'].forEach((c) => { $(c).hidden = c !== id; }); window.scrollTo(0, 0); }
  const clock = (ms) => { const s = Math.floor(ms / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };

  function presetClass() {
    const m = location.pathname.match(/\/quiz\/([a-z0-9-]+)/i);
    if (m) return m[1].toLowerCase();
    const h = location.hash.replace('#', '').toLowerCase();
    return /^(nursery-2|year-\d{1,2})$/.test(h) ? h : '';
  }

  async function loadClasses() {
    try {
      classes = (await api('GET', '/api/classes')).classes;
      const sel = $('c_class');
      classes.forEach((c) => { const o = document.createElement('option'); o.value = c.id; o.textContent = c.label; sel.appendChild(o); });
      const pre = presetClass();
      if (classes.some((c) => c.id === pre)) sel.value = pre;
    } catch (e) { $('c_err').textContent = e.message; }
  }

  // Handle Form Submission -> Launches directly into the interactive quiz!
  $('c_form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = $('c_name').value.trim(), school = $('c_school').value.trim(), classId = $('c_class').value;
    $('c_err').textContent = '';
    if (name.length < 2) return void ($('c_err').textContent = 'Please type your name!');
    if (school.length < 2) return void ($('c_err').textContent = 'Please type the name of your school!');
    if (!classId) return void ($('c_err').textContent = 'Please choose your class!');

    chime();

    // Map each class directly to its standalone interactive quiz page
    const directQuizzes = ['nursery-2', 'year-1', 'year-2', 'year-3', 'year-4', 'year-5', 'year-6'];
    if (directQuizzes.includes(classId)) {
      location.href = '/quiz/' + classId + '?name=' + encodeURIComponent(name) + '&school=' + encodeURIComponent(school);
      return;
    }

    // Generic fallback for any future classes
    $('c_go').disabled = true;
    try {
      const d = await api('POST', '/api/start', { name, school, classId });
      if (d.noQuiz) { $('c_noneClass').textContent = d.classLabel; show('c_none'); return; }
      st = { id: d.attemptId, qs: d.questions, answers: new Array(d.questions.length).fill(null), i: 0, t0: Date.now(), name, school, cls: classId };
      document.title = d.classLabel + ' Quiz · FutureIN';
      show('c_quiz');
      if (window.Gamify) Gamify.startQuiz();
      render();
      clearInterval(tick);
      tick = setInterval(() => { $('c_timer').textContent = '⏱ ' + clock(Date.now() - st.t0); }, 500);
    } catch (err) { $('c_err').textContent = err.message; }
    finally { $('c_go').disabled = false; }
  });

  // Mascot click animation
  $('mascotAvatar').onclick = () => {
    chime();
    const msgs = [
      "Ready to win stars? ⭐ You've got this!",
      "I'm cheering for you! 🚀 Choose your class!",
      "Are you the next big innovator? Let's find out! 💻",
      "Think fast, click accurately, and have fun! 🌟"
    ];
    $('mascotBubble').textContent = msgs[Math.floor(Math.random() * msgs.length)];
  };

  /* Fallback Quiz Runner */
  function render() {
    const q = st.qs[st.i];
    $('c_counter').textContent = 'Question ' + (st.i + 1) + ' of ' + st.qs.length;
    $('c_progress').style.width = (st.i / st.qs.length * 100) + '%';
    $('c_q').textContent = q.question;
    const box = $('c_opts'); box.innerHTML = '';
    q.options.forEach((opt, k) => {
      const b = document.createElement('button'); b.type = 'button';
      b.className = 'c-opt' + (st.answers[st.i] === k ? ' sel' : '');
      const l = document.createElement('span'); l.className = 'l'; l.textContent = 'ABCDEF'[k];
      const t = document.createElement('span'); t.textContent = opt;
      b.append(l, t);
      b.onclick = () => { st.answers[st.i] = k; popTone(); render(); };
      box.appendChild(b);
    });
    $('c_back').style.visibility = st.i === 0 ? 'hidden' : 'visible';
    $('c_next').disabled = st.answers[st.i] === null;
    $('c_next').textContent = st.i === st.qs.length - 1 ? 'Finish 🏁' : 'Next ▶';
    $('c_qerr').textContent = '';
  }

  $('c_back').onclick = () => { if (st.i > 0) { st.i--; render(); } };
  $('c_next').onclick = async () => {
    if (st.i < st.qs.length - 1) { st.i++; render(); return; }
    $('c_next').disabled = true;
    try {
      const payload = {
        attemptId: st.id,
        name: st.name,
        school: st.school,
        classId: st.cls,
        answers: st.answers,
        durationMs: Math.max(1000, Date.now() - st.t0)
      };
      let d = null;
      if (typeof saveAndSubmitQuizAttempt === 'function') {
        d = await saveAndSubmitQuizAttempt(payload);
      } else {
        d = await api('POST', '/api/submit', payload);
      }
      clearInterval(tick);
      chime();
      $('c_doneName').textContent = st.name.split(' ')[0];
      $('c_doneScore').textContent = (d ? d.score : 0) + ' / ' + (d ? d.total : st.qs.length);
      $('c_doneTime').textContent = 'You finished in ' + clock(d ? d.durationMs : (Date.now() - st.t0)) + '.';
      if (window.Gamify) {
        Gamify.renderBadges('c_doneBadges', {
          score: d ? d.score : 0,
          total: d ? d.total : st.qs.length,
          durationMs: d ? d.durationMs : (Date.now() - st.t0)
        });
      }
      show('c_done');
    } catch (err) {
      $('c_qerr').textContent = err.status === 0 ? 'No connection. Tap Finish again.' : err.message;
      $('c_next').disabled = false;
    }
  };
  function reset() { st = null; $('c_name').value = ''; $('c_school').value = ''; document.title = 'FutureIN Quiz'; if (window.Gamify) Gamify.reset(); show('c_start'); }
  $('c_again').onclick = reset;
  $('c_noneBack').onclick = () => show('c_start');

  loadClasses();
})();
</script>
</body>
</html>
