<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Year 6 ICT Quiz · FutureIN</title>
<link rel="icon" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<script src="/api.js"></script>
<link rel="stylesheet" href="/gamify.css">
<script src="/gamify.js"></script>
<style>
  :root{
    --bg1:#fff4e6; --bg2:#e6f4ff;
    --ink:#2f2a4a; --soft:#5f5a85; --card:#ffffff;
    --pink:#ff6b9a; --blue:#3aa8f0; --green:#36c46b; --yellow:#ffc93c; --purple:#7a5cff; --orange:#ff8a2a; --teal:#c2185b;
    --good:#36c46b; --bad:#ff6b6b;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --bg1:#2b2440; --bg2:#1c3346; --ink:#fffaf0; --soft:#d6d0f5; }
  }
  :root[data-theme="dark"]{ --bg1:#2b2440; --bg2:#1c3346; --ink:#fffaf0; --soft:#d6d0f5; }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; height:100%}
  body{font-family:'Fredoka','Comic Sans MS',system-ui,sans-serif; color:var(--ink);
    background:linear-gradient(160deg,var(--bg1),var(--bg2)); background-color:var(--bg1); min-height:100%; overflow-x:hidden}
  .bubbles span{position:fixed; border-radius:50%; opacity:.18; z-index:0; animation:float 9s ease-in-out infinite}
  @keyframes float{50%{transform:translateY(-30px)}}
  .wrap{position:relative; z-index:1; max-width:1040px; margin:0 auto; padding:16px 16px 40px; min-height:100vh; display:flex; flex-direction:column}

  .top{display:flex; align-items:center; gap:12px; justify-content:space-between; flex-wrap:wrap}
  .lesson-tag{background:var(--teal); color:#fff; font-weight:600; padding:8px 16px; border-radius:999px; font-size:clamp(14px,2.3vw,19px); box-shadow:0 4px 0 #8e1043}
  .progress{display:flex; gap:3px; flex-wrap:wrap; justify-content:center; max-width:520px}
  .progress i{width:clamp(13px,2.2vw,20px); height:clamp(13px,2.2vw,20px); border-radius:50%; background:#fff; border:3px solid #cfe7f5; display:grid; place-items:center; font-style:normal; font-size:clamp(8px,1.4vw,12px)}
  .progress i.now{border-color:var(--pink); transform:scale(1.25)}
  .progress i.done{background:var(--yellow); border-color:#f0a800}
  .progress i.miss{background:#ffe1c2; border-color:#ffb36b}
  .icon-btn{border:none; background:#fff; border-radius:50%; width:50px; height:50px; font-size:24px; cursor:pointer; box-shadow:0 4px 0 #cfe7f5}
  .icon-btn:active{transform:translateY(3px); box-shadow:0 1px 0 #cfe7f5}

  .q-area{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:clamp(12px,2.4vh,24px); padding-top:14px}
  .qnum{font-size:clamp(16px,2.5vw,21px); color:var(--soft); font-weight:600}
  .prompt-img{width:clamp(130px,22vw,190px); background:#fff; border-radius:24px; padding:10px; box-shadow:0 6px 0 rgba(0,0,0,.08); animation:pop .45s}
  .prompt-img svg{width:100%; height:auto; display:block}
  .prompt-img.wide{width:clamp(240px,46vw,400px)}
  .question{display:flex; align-items:center; gap:14px; background:#fff; color:#2f2a4a; padding:14px 22px; border-radius:26px; box-shadow:0 6px 0 rgba(0,0,0,.08); max-width:100%}
  .question h1{margin:0; font-size:clamp(21px,3.9vw,36px); line-height:1.25; text-align:center}
  .question h1 .blank{display:inline-block; min-width:2.6em; border-bottom:5px dashed var(--pink); margin:0 .15em}
  .question h1 em{font-style:normal; color:var(--teal)}
  .question .hint{font-size:clamp(28px,4.8vw,46px)}
  .say{flex:none; border:none; background:var(--blue); color:#fff; width:clamp(44px,6vw,56px); height:clamp(44px,6vw,56px); border-radius:50%; font-size:clamp(19px,3vw,26px); cursor:pointer; box-shadow:0 5px 0 #1f7fc0}
  .say:active{transform:translateY(4px); box-shadow:0 1px 0 #1f7fc0}

  .cards{display:grid; width:100%}
  .cards.pics{grid-template-columns:repeat(4,1fr); gap:clamp(10px,2vw,22px)}
  .cards.words{grid-template-columns:repeat(2,1fr); gap:16px; max-width:860px}
  .card{position:relative; border:5px solid var(--edge); cursor:pointer; padding:10px; font-family:inherit; color:#2f2a4a;
    background:var(--card); border-radius:24px; display:flex; align-items:center; justify-content:center;
    box-shadow:0 8px 0 var(--shade); transition:transform .15s, filter .2s; animation:pop .45s backwards}
  .cards.pics .card{aspect-ratio:1/1.05; flex-direction:column}
  .cards.words .card{justify-content:flex-start; gap:14px; padding:12px 18px; font-size:clamp(20px,3.4vw,30px); font-weight:700; text-align:left; min-height:80px}
  .letter{flex:none; width:clamp(38px,5.6vw,50px); height:clamp(38px,5.6vw,50px); border-radius:50%; background:var(--shade); color:#fff; display:grid; place-items:center; font-size:clamp(19px,3vw,26px); font-weight:700}
  .cards.pics .letter{position:absolute; top:8px; left:8px}
  .card:nth-child(1){--edge:#ffc2d6; --shade:#ff7fab; animation-delay:.04s}
  .card:nth-child(2){--edge:#bfe6ff; --shade:#3aa8f0; animation-delay:.12s}
  .card:nth-child(3){--edge:#ffe3a1; --shade:#ffb52e; animation-delay:.2s}
  .card:nth-child(4){--edge:#f8c6da; --shade:#c2185b; animation-delay:.28s}
  .card:hover{transform:translateY(-5px)}
  .card:active{transform:translateY(5px)}
  .card svg{width:82%; height:auto; max-height:82%}
  .card .emo{font-size:clamp(54px,10vw,110px); line-height:1}
  @keyframes pop{from{transform:scale(.4); opacity:0}}
  .card.right{--edge:var(--good); --shade:#23974f; animation:bounce .6s; filter:none}
  .card.right::after{content:"✔"; position:absolute; top:-15px; right:-10px; background:var(--good); color:#fff; width:46px; height:46px; border-radius:50%; display:grid; place-items:center; font-size:27px; box-shadow:0 4px 0 #23974f}
  .card.wrong{animation:shake .5s; filter:grayscale(1) brightness(.92); --edge:#ddd; --shade:#b5b5b5}
  .card.fade{filter:grayscale(.9); transform:scale(.95)}
  @keyframes bounce{30%{transform:scale(1.08)} 60%{transform:scale(.97)}}
  @keyframes shake{20%,60%{transform:translateX(-12px)} 40%,80%{transform:translateX(12px)}}

  .feedback{min-height:56px; text-align:center; max-width:780px}
  .feedback b{display:block; font-size:clamp(24px,4.4vw,38px)}
  .feedback small{display:block; font-size:clamp(17px,2.9vw,23px); color:var(--ink); margin-top:4px}
  .feedback.good b{color:var(--green)}
  .feedback.try b{color:var(--orange)}
  .next{border:none; background:var(--green); color:#fff; font-family:inherit; font-weight:700; font-size:clamp(22px,4vw,32px); padding:12px 42px; border-radius:999px; cursor:pointer; box-shadow:0 7px 0 #23974f; animation:pop .4s}
  .next:active{transform:translateY(5px); box-shadow:0 2px 0 #23974f}
  .hidden{display:none !important}

  .screen{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:18px}
  .screen h1{font-size:clamp(36px,7.5vw,70px); margin:0; color:var(--teal); text-shadow:0 4px 0 #fff}
  .screen p{font-size:clamp(19px,3.4vw,28px); margin:0; color:var(--soft)}
  .mascot{width:clamp(160px,30vw,240px); animation:wobble 2.4s ease-in-out infinite}
  @keyframes wobble{25%{transform:rotate(-5deg)} 75%{transform:rotate(5deg)}}
  .big-btn{border:none; background:var(--pink); color:#fff; font-family:inherit; font-weight:700; font-size:clamp(26px,4.8vw,40px); padding:14px 54px; border-radius:999px; cursor:pointer; box-shadow:0 8px 0 #d6457a}
  .big-btn:active{transform:translateY(6px); box-shadow:0 2px 0 #d6457a}
  .stars-row{font-size:clamp(22px,4vw,36px); letter-spacing:2px; max-width:min(640px,100%); word-break:break-all; line-height:1.3}
  .topics{display:flex; gap:10px; flex-wrap:wrap; justify-content:center; max-width:780px}
  .topics span{background:#fff; color:#2f2a4a; padding:6px 14px; border-radius:999px; font-size:clamp(14px,2.3vw,18px); box-shadow:0 3px 0 #cfe7f5}

  /* Form fields on start */
  .child-info{display:flex; flex-direction:column; gap:10px; width:100%; max-width:380px; margin:8px auto}
  .child-info input{
    font-family:inherit; font-size:18px; padding:12px 18px; border-radius:18px;
    border:3px solid var(--teal); background:#fff; color:#2f2a4a; outline:none; text-align:center;
  }
  .child-info input:focus{border-color:var(--pink); box-shadow:0 0 0 3px rgba(255,107,154,.3)}
  .err-msg{color:var(--bad); font-weight:700; font-size:16px}
  .nav-back{margin-top:14px; color:var(--soft); font-size:16px; text-decoration:none; font-weight:600}
  .nav-back:hover{color:var(--pink)}

  .confetti{position:fixed; top:-30px; z-index:50; pointer-events:none; animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

  @media (max-width:640px){
    .cards.pics{grid-template-columns:repeat(2,1fr); gap:12px}
    .cards.words{grid-template-columns:1fr; gap:12px}
    .cards.words .card{min-height:64px}
    .card{border-radius:20px; border-width:4px; box-shadow:0 6px 0 var(--shade)}
    .card.right::after{width:38px; height:38px; font-size:21px; top:-11px; right:-7px}
    .question{padding:12px 14px; gap:10px}
  }
</style>
</head>
<body>
<div class="bubbles" aria-hidden="true"></div>

<div class="wrap">
  <section id="start" class="screen">
    <div class="mascot" id="mascotStart"></div>
    <h1>Year 6 ICT Quiz</h1>
    <p>20 questions · Read carefully and choose A, B, C or D</p>
    <div class="topics">
      <span>👩‍💻 Computer Personnel</span><span>🧠 Expert Systems</span><span>✍️ Writing with AI</span><span>💡 Improving AI Ideas</span><span>🔊 AI Text-to-Speech</span>
    </div>

    <div class="child-info" id="infoBox">
      <input id="childName" placeholder="Your name (e.g. Victor)" maxlength="60">
      <input id="childSchool" placeholder="Your school" maxlength="80">
      <div class="err-msg" id="nameErr"></div>
    </div>

    <button class="big-btn" id="startBtn">▶ Start</button>
    <a href="/" class="nav-back">← Choose another class</a>
  </section>

  <section id="quiz" class="hidden" style="flex:1; display:flex; flex-direction:column">
    <div class="top">
      <div class="lesson-tag" id="lessonTag">Week 1</div>
      <div class="progress" id="progress"></div>
      <button class="icon-btn" id="soundBtn" title="Sound on/off">🔊</button>
    </div>
    <div class="q-area">
      <div class="qnum" id="qNum"></div>
      <div class="prompt-img hidden" id="promptImg"></div>
      <div class="question">
        <span class="hint" id="hint"></span>
        <h1 id="qText"></h1>
        <button class="say" id="sayBtn" title="Hear the question">🔈</button>
      </div>
      <div class="cards" id="cards"></div>
      <div class="feedback" id="feedback"></div>
      <button class="next hidden" id="nextBtn">Next ▶</button>
    </div>
  </section>

  <section id="end" class="screen hidden">
    <div style="font-size:clamp(90px,17vw,150px); animation:wobble 2s infinite">🏆</div>
    <h1 id="endTitle">Well Done!</h1>
    <p id="endText"></p>
    <div class="stars-row" id="endStars"></div>
    <div id="badgesBox"></div>
    <button class="big-btn" id="againBtn">🔁 Play Again</button>
  </section>
</div>

<script>

const PRAISE = ["Correct!", "Super!", "Well done!", "Great job!", "Excellent!", "Brilliant!"];

/* ================= SOUND + VOICE ================= */
let soundOn=true, actx=null;
function tone(freq,start,dur,type='sine',vol=.18){
  if(!soundOn) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), g=actx.createGain(); o.type=type; o.frequency.value=freq;
    g.gain.setValueAtTime(vol, actx.currentTime+start); g.gain.exponentialRampToValueAtTime(.001, actx.currentTime+start+dur);
    o.connect(g).connect(actx.destination); o.start(actx.currentTime+start); o.stop(actx.currentTime+start+dur);
  }catch(e){}
}
const happySound=()=>[523,659,784,1047].forEach((f,i)=>tone(f,i*.1,.3,'triangle'));
const oopsSound=()=>{ tone(330,0,.18); tone(262,.16,.25); };
function speak(text){
  if(!soundOn) return;
  if(window.Gamify && Gamify.speak) {
    Gamify.speak(text);
  } else if('speechSynthesis' in window) {
    try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.rate=.92; u.pitch=1.1; u.lang='en-GB'; speechSynthesis.speak(u); }catch(e){}
  }
}
function confetti(){
  const bits=['⭐','🎉','🌟','✨'], colors=['#ff6b9a','#3aa8f0','#ffc93c','#36c46b','#c2185b'];
  for(let i=0;i<30;i++){
    const d=document.createElement('div'); d.className='confetti';
    if(i%3===0){ d.textContent=bits[i%bits.length]; d.style.fontSize=(18+Math.random()*20)+'px'; }
    else { d.style.width='12px'; d.style.height='16px'; d.style.borderRadius='3px'; d.style.background=colors[i%colors.length]; }
    d.style.left=Math.random()*100+'vw'; d.style.animationDuration=(1.6+Math.random()*1.6)+'s'; d.style.animationDelay=(Math.random()*.3)+'s';
    document.body.appendChild(d); setTimeout(()=>d.remove(),3800);
  }
}

/* ================= GAME & BACKEND INTEGRATION ================= */
const $=id=>document.getElementById(id);
let idx=0, stars=0, firstTry=true, answered=false, results=[];
let studentName = '', studentSchool = '', attemptId = null, answersRecord = [];

// Pre-fill name and school from URL query parameters if present
const urlParams = new URLSearchParams(window.location.search);
if (urlParams.get('name')) $('childName').value = urlParams.get('name');
if (urlParams.get('school')) $('childSchool').value = urlParams.get('school');

const shuffle=a=>{a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a;};
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function drawProgress(){
  $('progress').innerHTML = QUESTIONS.map((_,i)=>{
    const cls = i<idx ? (results[i] ? 'done' : 'miss') : (i===idx ? 'now' : '');
    return `<i class="${cls}">${i<idx ? (results[i] ? '⭐' : '✓') : ''}</i>`;
  }).join('');
}

function showQuestion(){
  const q=QUESTIONS[idx]; firstTry=true; answered=false;
  if(window.Gamify) Gamify.onQuestionChange(q);
  $('lessonTag').textContent=q.lesson;
  $('qNum').textContent=`Question ${idx+1} of ${QUESTIONS.length}`;
  $('hint').textContent=q.hint;
  $('qText').innerHTML=q.text.replace('___','<span class="blank"></span>');
  if(q.img){ $('promptImg').innerHTML=PICS[q.img]; $('promptImg').classList.remove('hidden'); $('promptImg').classList.toggle('wide', !!q.wide); }
  else { $('promptImg').classList.add('hidden'); $('promptImg').innerHTML=''; }
  $('feedback').innerHTML=''; $('feedback').className='feedback';
  $('nextBtn').classList.add('hidden');
  drawProgress();
  const cards=$('cards'); cards.innerHTML=''; cards.className='cards '+(q.type==='pic'?'pics':'words');
  shuffle(q.options).forEach(([val,ok],i)=>{
    const b=document.createElement('button'); b.className='card'; b.dataset.ok=ok?'1':'0';
    const letter=`<span class="letter">${'ABCD'[i]}</span>`;
    b.innerHTML = q.type==='pic'
      ? letter + (PICS[val] || `<span class="emo">${val}</span>`)
      : letter + `<span>${esc(val)}</span>`;
    b.onclick=()=>choose(b,ok);
    cards.appendChild(b);
  });
  setTimeout(()=>speak(q.say), 350);
}

function choose(btn,ok){
  if(answered || btn.classList.contains('wrong')) return;
  const q=QUESTIONS[idx];
  if(ok){
    answered=true; results[idx]=firstTry;
    if(firstTry) {
      stars++;
      answersRecord[idx] = 0;
    } else {
      answersRecord[idx] = 1;
    }
    btn.classList.add('right');
    [...$('cards').children].forEach(c=>{ if(c!==btn) c.classList.add('fade'); });
    if(window.Gamify) Gamify.recordAnswer(firstTry, btn, q);
    const word=PRAISE[Math.floor(Math.random()*PRAISE.length)];
    $('feedback').innerHTML=`<b>🎉 ${word} 🎉</b><small>${esc(q.yay)}</small>`; $('feedback').className='feedback good';
    happySound(); confetti(); setTimeout(()=>speak(word+' '+q.yay),300);
    $('nextBtn').textContent = idx===QUESTIONS.length-1 ? 'Finish 🏁' : 'Next ▶';
    $('nextBtn').classList.remove('hidden');
  } else {
    firstTry=false; btn.classList.add('wrong');
    if(window.Gamify) Gamify.recordAnswer(false, btn);
    $('feedback').innerHTML='<b>Not quite! Try again 😊</b>'; $('feedback').className='feedback try';
    oopsSound(); speak('Not quite! Try again!');
  }
}

function next(){
  if(window.Gamify) Gamify.clearFact();
  idx++;
  if(idx>=QUESTIONS.length) return finish();
  showQuestion();
  window.scrollTo(0,0);
}

async function finish(){
  $('quiz').classList.add('hidden'); $('end').classList.remove('hidden');
  const n=QUESTIONS.length;
  const greeting = studentName ? `Well done, ${studentName}!` : (stars>=16 ? 'Excellent!' : stars>=11 ? 'Well Done!' : 'Good Try!');
  $('endTitle').textContent = greeting;
  $('endText').textContent=`You scored ${stars} out of ${n}!`;
  $('endStars').textContent='⭐'.repeat(stars)+'☆'.repeat(n-stars);
  happySound(); confetti(); setTimeout(confetti,900);
  speak(`${greeting} You scored ${stars} out of ${n}! You are a computer star!`);

  if(window.Gamify){
    Gamify.renderBadges('badgesBox', {
      score: stars,
      total: n,
      durationMs: Date.now() - (window._quizStartTime || Date.now())
    });
  }

  // Submit attempt to server with fail-safe persistence
  const payload = {
    attemptId,
    name: studentName,
    school: studentSchool,
    classId: 'year-6',
    score: stars,
    total: n,
    durationMs: Math.max(1000, Date.now() - (window._quizStartTime || Date.now())),
    answers: answersRecord
  };
  if (typeof saveAndSubmitQuizAttempt === 'function') {
    saveAndSubmitQuizAttempt(payload);
  } else if (attemptId) {
    api('POST', '/api/submit', payload).catch(e => console.warn(e));
  }
}

async function start(){
  window._quizStartTime = Date.now();
  const name = $('childName').value.trim();
  const school = $('childSchool').value.trim() || 'Precious Innovators';
  $('nameErr').textContent = '';
  if (name.length < 2) {
    $('nameErr').textContent = 'Please type your name!';
    $('childName').focus();
    return;
  }
  studentName = name;
  studentSchool = school;
  idx = 0; stars = 0; results = [];
  answersRecord = new Array(QUESTIONS.length).fill(null);
  if(window.Gamify) Gamify.reset();

  // Register attempt with backend
  try {
    const res = await api('POST', '/api/start', { name: studentName, school: studentSchool, classId: 'year-6' });
    attemptId = res.attemptId;
  } catch (e) {
    console.warn('Local mode (offline attempt):', e);
  }

  $('start').classList.add('hidden'); $('end').classList.add('hidden'); $('quiz').classList.remove('hidden');
  if(window.Gamify) Gamify.startQuiz();
  showQuestion();
}

$('mascotStart').innerHTML=PICS.mascot;
$('startBtn').onclick=start;
$('againBtn').onclick=() => {
  $('end').classList.add('hidden');
  $('start').classList.remove('hidden');

$('sayBtn').onclick=()=>speak(QUESTIONS[idx].say);

if (urlParams.get('name')) {
